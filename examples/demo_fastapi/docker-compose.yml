services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dbro
      POSTGRES_PASSWORD: dbro
      POSTGRES_DB: dbro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbro -d dbro"]
      interval: 3s
      timeout: 5s
      retries: 20
